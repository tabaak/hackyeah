# Production server for the `prod` Dockerfile target: the built SPA, plus the
# /api proxy that the Vite dev server provides in development.
server {
    listen 5173;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved per request: the api container's address
    # changes when it is recreated, and nginx would otherwise keep the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Document uploads: up to 8 files of 5 MB in one request.
        client_max_body_size 45m;
    }

    # Server-sent events: pass each event through as it is written.
    location = /api/v1/mentions/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed file names: safe to cache for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes fall back to the app shell, which is never cached so
    # a new deploy is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
