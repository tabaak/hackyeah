name: palladion

services:
  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-bonsai-2-27b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_LIMIT_X: ${APIFY_LIMIT_X:-200}
      APIFY_LIMIT_FACEBOOK: ${APIFY_LIMIT_FACEBOOK:-30}
      APIFY_LIMIT_THREADS: ${APIFY_LIMIT_THREADS:-10}
      SERPER_PAGES: ${SERPER_PAGES:-3}
      NEWS_WINDOW: ${NEWS_WINDOW:-w}
      NEWS_RSS: ${NEWS_RSS:-true}
      LLM_ANALYSE_ALL: ${LLM_ANALYSE_ALL:-false}
      APIFY_MAX_AGE_DAYS: ${APIFY_MAX_AGE_DAYS:-30}
      DEMO_SEED: ${DEMO_SEED:-true}
      DEMO_LIVE_INTERVAL_SECONDS: ${DEMO_LIVE_INTERVAL_SECONDS:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend_node_modules:
