[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    live: calls a real service (Serper, OpenAI, local LLM server, Supabase); skipped unless pytest runs with --live
    db: applies supabase/migrations to a throwaway Postgres container (needs Docker)
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
